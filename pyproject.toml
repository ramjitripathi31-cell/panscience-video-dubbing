[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panscience-video-dubbing"
version = "0.1.0"
description = "Job orchestration foundation for a video dubbing service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "python-json-logger>=2.0,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
