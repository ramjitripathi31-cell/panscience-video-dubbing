services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app-environment
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-panscience}:${POSTGRES_PASSWORD:-panscience}@postgres:5432/${POSTGRES_DB:-panscience}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-3600}
      PROVIDER_DIARIZATION: demo
      PROVIDER_SPEECH_TO_TEXT: demo
      PROVIDER_TRANSLATION: demo
      PROVIDER_TEXT_TO_SPEECH: demo
      PROVIDER_STORAGE: local
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    environment: *app-environment
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panscience}
      POSTGRES_USER: ${POSTGRES_USER:-panscience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panscience}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  app_storage:
